services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend  # 明确指定后端Dockerfile文件名
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Cloud123456  # 和你后面K8s里的Secret密码保持一致
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend  # 明确指定前端Dockerfile文件名
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass Cloud123456  # 和上面的密码保持一致