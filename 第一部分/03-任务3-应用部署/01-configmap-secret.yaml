# Redis配置ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: default
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    requirepass Cloud123456
---
# Redis密码Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: default
type: Opaque
data:
  redis-password: Q2xvdWQxMjM0NTY=
---
# SWR镜像拉取密钥
apiVersion: v1
kind: Secret
metadata:
  name: swr-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: 你的SWR拉取密钥内容